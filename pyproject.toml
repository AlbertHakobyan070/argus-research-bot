[project]
name = "argus"
version = "0.1.0"
description = "Argus — FreeLLMAPI multi-agent Telegram research bot (LangGraph)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3,<2",
    "langgraph>=1.2.8,<2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20",
    "python-telegram-bot[ext]>=22.8",   # InlineKeyboardButton(style=...); newer Bot API methods go through do_api_request
    "pydantic>=2.7",
    "httpx>=0.27,<0.29",            # fetchers reads httpx 0.28's proxy selection (Client._transport_for_url)
    "python-dotenv>=1.0",
    "markdown>=3.6",
    "reportlab>=4.0",
    "ddgs>=9.0",
    "yt-dlp>=2026.6",
    "imageio-ffmpeg>=0.6",
    # v4: Mini App server (aiohttp), native fetcher (trafilatura, pypdf)
    "aiohttp>=3.14,<4",
    "trafilatura>=2.3,<3",
    "pypdf>=6,<7",
    # v4: the engines driver calls the openai SDK directly
    "openai>=2.44,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
asr = [
    "faster-whisper>=1.1",
]
# Free-web fetchers (engines/fetchers.py): the scrapling rung (a browser's TLS and headers, no
# browser) and the browser rung (headless Chromium: then `python -m playwright install chromium`).
# scrapling <0.6: the rung pins each hop through its FetcherSession's curl session. playwright 1.64
# drives Chromium build 1248; patchright (scrapling's) is held on the same release.
web = [
    "scrapling[fetchers]>=0.5.1,<0.6",
    "playwright>=1.64.1,<1.65",
    "patchright>=1.64.3,<1.65",
]
# Word, PowerPoint and Excel pages, through MarkItDown (PDFs stay on pypdf).
convert = [
    "markitdown[docx,pptx,xlsx]>=0.1.9,<0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]